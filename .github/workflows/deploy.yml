name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages 發布需要的最小權限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只發布一次；新的推送會取代排隊中的發布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 測試不連網（Riot 與 valorant-api 都用假資料）。
      - run: flutter test

      # 專案頁的網址是 /<repo 名稱>/，base href 必須一致。
      # APP_BUILD 給「有新版本」提示比對；VAPID_PUBLIC_KEY 是推播公鑰（repo variable，可以公開，見 docs/push.md）。
      - run: >-
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          --dart-define=APP_BUILD=${{ github.sha }}
          --dart-define=VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}

      # 已開著的頁面會定期讀這個檔，和自己的 APP_BUILD 不同就顯示「有新版本」。
      - run: echo '{"build":"${{ github.sha }}"}' > build/web/app_build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
