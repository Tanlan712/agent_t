name: Build mobile apps

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # PR 只建置、不發布，用來先確認 APK／IPA 建得出來。
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 建立 GitHub Release 需要寫入權限。
permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 測試不連網（Riot 與 valorant-api 都用假資料）。
      - run: flutter test

      # 有設定簽章 secrets 時用固定金鑰，之後的版本才能直接覆蓋安裝；沒有時用 debug 金鑰（見 docs/android.md）。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::沒有設定 ANDROID_KEYSTORE_BASE64，改用 debug 簽章；每次更新可能要先移除舊版。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-number ${{ github.run_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk valorant-shop-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: valorant-shop-tracker-apk
          path: valorant-shop-tracker.apk

  # 未簽章的 IPA：由使用者用自己的免費 Apple ID 簽章安裝（見 docs/ios.md）。
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry valorant-shop-tracker-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: valorant-shop-tracker-ipa
          path: valorant-shop-tracker-unsigned.ipa

  release:
    if: github.event_name != 'pull_request'
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: '手機 App #${{ github.run_number }}'
          body: |
            自己側載安裝用的手機 App（${{ github.sha }}）。
            Android：https://github.com/${{ github.repository }}/releases/latest/download/valorant-shop-tracker.apk
            iOS（未簽章，用自己的 Apple ID 簽章安裝，見 docs/ios.md）：https://github.com/${{ github.repository }}/releases/latest/download/valorant-shop-tracker-unsigned.ipa
          files: |
            valorant-shop-tracker.apk
            valorant-shop-tracker-unsigned.ipa
          make_latest: true

      # 只保留最新一版：刪掉其他 app-v* release，連同它們的 tag。
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT: app-v${{ github.run_number }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep '^app-v' | grep -vx "$CURRENT" \
            | while read -r tag; do
                echo "刪除 $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
