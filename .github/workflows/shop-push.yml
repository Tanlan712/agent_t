name: 商店刷新通知

# 每日商店在 UTC 00:00（台灣 08:00）刷新；GitHub 排程可能延遲幾分鐘到一小時。
# 只送一則固定內容的通知，不連 Riot、不讀任何帳號資料（docs/push.md）。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只裝在 tool/shop_push 裡，版本固定。
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
        working-directory: tool/shop_push

      # repo 是公開的：私鑰與訂閱只經由環境變數傳入，腳本不印出任何內容。
      - run: node send.mjs
        working-directory: tool/shop_push
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUBJECT: https://github.com/${{ github.repository }}
