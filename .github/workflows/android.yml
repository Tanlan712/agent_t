name: Build Android APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # PR 只建置、不發布，用來先確認 APK 建得出來。
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 建立 GitHub Release 需要寫入權限。
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 測試不連網（Riot 與 valorant-api 都用假資料）。
      - run: flutter test

      # 有設定簽章 secrets 時用固定金鑰，之後的版本才能直接覆蓋安裝；沒有時用 debug 金鑰（見 docs/android.md）。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::沒有設定 ANDROID_KEYSTORE_BASE64，改用 debug 簽章；每次更新可能要先移除舊版。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-number ${{ github.run_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk valorant-shop-tracker.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: valorant-shop-tracker-apk
          path: valorant-shop-tracker.apk

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android 版 #${{ github.run_number }}
          body: |
            自己側載安裝用的 Android App（${{ github.sha }}）。
            手機下載最新版：https://github.com/${{ github.repository }}/releases/latest/download/valorant-shop-tracker.apk
          files: valorant-shop-tracker.apk
          make_latest: true
